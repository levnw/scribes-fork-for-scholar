name: Build release JARs
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - name: Build and verify release inputs
        run: |
          java -version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          python3 ci/build-release.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: scribes-fork-release-jars
          path: dist/
          if-no-files-found: error
